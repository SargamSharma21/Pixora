<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PIXORA - Studio</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

        <link
            rel="stylesheet"
            href="css/shared.css?v=2"
        >

</head>


<body>

    <!-- ================= NAVBAR ================= -->

    <nav>

        <h1>PIXORA</h1>

        <ul>

            <li>
                <a href="index.html" class="active">
                    Studio
                </a>
            </li>

            <li>
                <a href="feed.html">
                    Public Feed
                </a>
            </li>

            <li>
                <a href="draft.html">
                    My Drafts
                </a>
            </li>

            <li>
                <a href="profile.html">
                    Profile
                </a>
            </li>

            <li>
                <button id="logout-btn" type="button">
                    Logout
                </button>
            </li>

        </ul>

    </nav>


    <!-- ================= MAIN EDITOR ================= -->

    <main class="wrapper">

        <div class="editor-header">

            <div>

                <p class="eyebrow">
                    PIXEL EDITOR
                </p>

                <h2>
                    Create something.
                </h2>

            </div>

            <div class="editor-header-actions">
                <button id="toggle-toolbox-btn" class="toolbox-toggle" type="button">
                    Hide toolbox
                </button>
                <span id="user-display"></span>
            </div>

        </div>

        <div class="title-meta">

            <label for="artwork-title">
                Artwork name
            </label>

            <input
                type="text"
                id="artwork-title"
                maxlength="50"
                placeholder="Name your artwork..."
            >

        </div>

        <div class="editor-layout" id="editor-layout">

            <aside class="editor-sidebar" id="editor-sidebar">

                <section class="editor-section">

                    <div class="section-heading">

                        <div>

                            <h3>
                                Grid
                            </h3>

                            <span>
                                Canvas size
                            </span>

                        </div>

                    </div>

                    <div class="grid-settings">

                        <div class="slider-control">

                            <label for="width-range">
                                Width
                            </label>

                            <input
                                type="range"
                                id="width-range"
                                min="1"
                                max="35"
                                value="16"
                            >

                            <span id="width-value">
                                16
                            </span>

                        </div>

                        <div class="slider-control">

                            <label for="height-range">
                                Height
                            </label>

                            <input
                                type="range"
                                id="height-range"
                                min="1"
                                max="35"
                                value="16"
                            >

                            <span id="height-value">
                                16
                            </span>

                        </div>

                    </div>

                    <div class="slider">
                        <label for="pixel-size-range">Pixel Size</label>

                        <input
                            type="range"
                            id="pixel-size-range"
                            min="10"
                            max="40"
                            value="20"
                        >

                        <span id="pixel-size-value">20px</span>
                    </div>

                    <button
                        id="submit-grid"
                        class="create-grid-btn"
                    >
                        Create Grid
                    </button>

                </section>

                <section class="editor-section">

                    <div class="section-heading">

                        <div>

                            <h3>
                                Tools
                            </h3>

                            <span>
                                Choose your brush
                            </span>

                        </div>

                    </div>

                    <div class="tool-bar">

                        <div class="color-wrapper">

                            <input
                                type="color"
                                id="color-input"
                                value="#000000"
                            >

                        </div>

                        <button
                            id="paint-btn"
                            class="editControls selectedEditControl tool-btn"
                        >
                            ✏️ Paint
                        </button>

                        <button
                            id="erase-btn"
                            class="editControls tool-btn"
                        >
                            🧹 Erase
                        </button>

                        <button
                            id="clear-grid"
                            class="tool-btn danger-light"
                        >
                            🗑 Clear
                        </button>

                    </div>

                </section>

                <section class="editor-section palette-section">

                    <div class="section-heading">

                        <div>

                            <h3>
                                Palette
                            </h3>

                            <span id="palette-status">
                                Generate a palette for inspiration
                            </span>

                        </div>

                        <button
                            id="fetch-palette-btn"
                            class="palette-btn"
                        >
                            ↻ Random
                        </button>

                    </div>

                    <div
                        id="palette-container"
                        class="palette-container"
                    ></div>

                </section>

            </aside>

            <div class="editor-canvas-panel">

                <section class="canvas-section">

                    <div class="section-heading">

                        <div>

                            <h3>
                                Canvas
                            </h3>

                            <span>
                                Click and drag to draw
                            </span>

                        </div>

                    </div>

                    <div class="container">

                        <canvas id="pixel-canvas"></canvas>

                    </div>

                </section>

                <div class="action-wrapper">

                    <button
                        id="save-draft-btn"
                        class="btn-secondary"
                    >
                        Save Draft
                    </button>

                    <button
                        id="post-art-btn"
                        class="btn-primary"
                    >
                        Publish
                    </button>

                    <button
                        id="download-png-btn"
                        class="btn-secondary"
                    >
                        ↓ PNG
                    </button>

                    <button
                        id="share-art-btn"
                        class="btn-share"
                    >
                        ↗ Share
                    </button>

                </div>

            </div>

        </div>

    </main>


    <script src="js/script.js?v=3"></script>

</body>

</html>
