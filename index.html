<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pixel Art Studio</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav>
        <h1>👾 PIXEL STUDIO</h1>

        <ul>
            <li><a href="index.html">Studio</a></li>
            <li><a href="feed.html">Feed</a></li>
            <li><a href="draft.html">My Drafts</a></li>
            <li><a href="profile.html">Profile</a></li>
            <li><span id="user-display"></span></li>
        </ul>  
        
    </nav>

    <main class="wrapper">

        <h2>Pixel Art Studio</h2>

        <div class="title-meta">
            <input
                type="text"
                id="artwork-title"
                placeholder="Name your artwork..."
            >
        </div>

        <div class="options">

            <div class="slider">
                <label for="width-range">Grid Width</label>
                <input
                    type="range"
                    id="width-range"
                    min="1"
                    max="35"
                    value="16"
                >
                <span id="width-value">16</span>
            </div>

            <div class="slider">
                <label for="height-range">Grid Height</label>
                <input
                    type="range"
                    id="height-range"
                    min="1"
                    max="35"
                    value="16"
                >
                <span id="height-value">16</span>
            </div>

            <button id="submit-grid">Create Grid</button>
            <input type="color" id="color-input" value="#000000">
            <button id="erase-btn">Erase</button>
            <button id="paint-btn">Paint</button>
            <button id="clear-btn">Clear</button>
            <button id="save-draft-btn">Save as Draft</button>

        </div>

        <div class="container">
            <canvas id="pixel-canvas"></canvas>
        </div>

    </main>

    <script src="js/script.js"></script>

</body>
</html>
