<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PIXORA - Profile</title>

    <link rel="stylesheet"
          href="css/profile.css">

</head>

<body>

    <nav>

        <h1>👾 PIXORA</h1>

        <ul>

            <li>
                <a href="index.html">
                    Studio
                </a>
            </li>

            <li>
                <a href="draft.html">
                    My Drafts
                </a>
            </li>

            <li>
                <a href="profile.html">
                    Profile
                </a>
            </li>

        </ul>

    </nav>


    <main class="profile-wrapper">

        <div class="profile-card">

            <div class="profile-avatar">
                👤
            </div>

            <h2 id="profile-username">
                Username
            </h2>

            <p id="profile-bio">
                Pixel artist
            </p>

            <button id="edit-profile-btn">
                Edit Profile
            </button>

            <div id="profile-form" class="profile-form hidden">

                <input
                    type="text"
                    id="username-input"
                    placeholder="Username"
                    maxlength="30"
                >

                <textarea
                    id="bio-input"
                    placeholder="Tell us about yourself..."
                    maxlength="150"
                ></textarea>

                <button id="save-profile-btn">
                    Save Profile
                </button>

            </div>

            <section class="profile-artworks">

            <h3>My Artwork</h3>

            <div id="profile-artwork-grid"></div>

        </section>

        </div>

    </main>


    <script src="js/profile.js"></script>

</body>

</html>
