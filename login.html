<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pixel Studio - Login</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

    <nav>
        <h1>👾 PIXORA</h1>
    </nav>

    <main class="wrapper auth-wrapper">

        <h2>Welcome to Pixel Studio</h2>

        <div class="auth-form">

            <input
                type="text"
                id="username"
                placeholder="Username"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
            >

            <div class="auth-buttons">

                <button id="register-btn">
                    Register
                </button>

                <button id="login-btn">
                    Login
                </button>

            </div>

            <p id="auth-msg"></p>

        </div>

    </main>

    <script src="js/auth.js"></script>

</body>
</html>
